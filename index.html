<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Animal AR Experience</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #ar-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #start-button {
      position: fixed;
      left: 50%;
      bottom: 40px;
      z-index: 10;
      transform: translateX(-50%);

      border: 0;
      border-radius: 999px;
      padding: 15px 28px;

      color: #fff;
      background: #198754;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
    }

    #start-button:hover {
      background: #146c43;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);

      width: calc(100% - 40px);
      max-width: 500px;
      padding: 12px 16px;

      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div id="ar-container"></div>

  <div id="message">
    Point your camera at the target image.
  </div>

  <button id="start-button">
    Start AR
  </button>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>

  <!-- GLTF model loader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <script>
    const startButton = document.getElementById("start-button");
    const message = document.getElementById("message");

    let mindarThree;
    let animalModel;

    async function startAR() {
      startButton.classList.add("hidden");
      message.textContent = "Starting camera...";

      mindarThree = new MindARThree({
        container: document.getElementById("ar-container"),
        imageTargetSrc: "./targets.mind",
        uiLoading: "no",
        uiScanning: "yes",
        uiError: "yes"
      });

      const {
        renderer,
        scene,
        camera
      } = mindarThree;

      const light = new THREE.HemisphereLight(
        0xffffff,
        0xbbbbff,
        2
      );

      scene.add(light);

      const directionalLight = new THREE.DirectionalLight(
        0xffffff,
        2
      );

      directionalLight.position.set(1, 3, 2);
      scene.add(directionalLight);

      const anchor = mindarThree.addAnchor(0);

      const loader = new THREE.GLTFLoader();

      loader.load(
        "./animal.gltf",

        function (gltf) {
          animalModel = gltf.scene;

          animalModel.scale.set(0.3, 0.3, 0.3);
          animalModel.position.set(0, 0, 0);
          animalModel.rotation.set(0, 0, 0);

          anchor.group.add(animalModel);

          message.textContent = "Point your camera at target.png";
        },

        function (progress) {
          if (progress.total) {
            const percent = Math.round(
              (progress.loaded / progress.total) * 100
            );

            message.textContent = `Loading animal model: ${percent}%`;
          }
        },

        function (error) {
          console.error("Could not load animal.gltf:", error);
          message.textContent = "Error loading the animal model.";
        }
      );

      anchor.onTargetFound = function () {
        message.textContent = "Animal found!";
      };

      anchor.onTargetLost = function () {
        message.textContent = "Point your camera at target.png";
      };

      await mindarThree.start();

      renderer.setAnimationLoop(function () {
        if (animalModel) {
          animalModel.rotation.y += 0.01;
        }

        renderer.render(scene, camera);
      });
    }

    startButton.addEventListener("click", startAR);
  </script>
</body>
</html>
